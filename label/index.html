<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拼图标注台 · 编号 + 整块框</title>
<style>
:root{ --bg:#0b0f14; --panel:#121820; --line:#243040; --tx:#dce6f2; --dim:#8fa0b4;
       --ok:#3ce678; --warn:#ffc628; --bad:#ff5f5f; --sel:#ffd45e; --auto:#50c8ff; }
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
body{background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
     display:flex; flex-direction:column;}
button{font:inherit; color:var(--tx); background:#1a2330; border:1px solid var(--line);
       border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap;}
button:hover{background:#232f40;}
button:active{transform:scale(.96);}
button.on{background:#2a3a50; border-color:#3d5273; color:#cfe4ff;}
button.pri{background:#1d3a28; border-color:#3f7a52; color:#d8ffe6;}
input{font:inherit; color:var(--tx); background:#0e141c; border:1px solid var(--line);
      border-radius:8px; padding:6px 10px; outline:none;}
input:focus{border-color:#3d6ea5;}
/* ---- 顶栏 ---- */
#bar{display:flex; gap:8px; align-items:center; padding:8px 10px; background:var(--panel);
     border-bottom:1px solid var(--line); flex-wrap:wrap;}
#bar .name{color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; max-width:240px;}
#stat{color:var(--dim); font-size:12.5px;}
#stat b{color:var(--tx);}
/* ---- 主区 ---- */
#main{flex:1; display:flex; min-height:0;}
#stage{flex:1; position:relative; overflow:hidden; background:#060a10; touch-action:none;}
#cv{position:absolute; left:50%; top:50%; transform-origin:center; cursor:crosshair;}
#cv.pan{cursor:grab;}
/* ---- 侧栏 ---- */
#side{width:216px; background:var(--panel); border-left:1px solid var(--line);
      display:flex; flex-direction:column;}
#side .hd{padding:8px 10px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--line);
          display:flex; justify-content:space-between; align-items:center;}
#plist{flex:1; overflow-y:auto; padding:4px;}
.pi{display:flex; gap:6px; align-items:center; padding:6px 8px; border-radius:7px; cursor:pointer;
    font-family:ui-monospace,Consolas,monospace; font-size:12.5px;}
.pi:hover{background:#1a2330;}
.pi.sel{background:#2a3a50; outline:1px solid #3d5273;}
.pi .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.pi .lb{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pi .cf{color:var(--dim); font-size:11px;}
#hint{padding:8px 10px; font-size:11.5px; color:var(--dim); border-top:1px solid var(--line); line-height:1.6;}
/* ---- 编辑条 ---- */
#edbar{display:none; gap:8px; align-items:center; padding:8px 10px; background:var(--panel);
       border-top:1px solid var(--line); flex-wrap:wrap;}
#edbar.on{display:flex;}
#edLabel{width:130px; font-family:ui-monospace,Consolas,monospace; letter-spacing:1px; font-size:15px;}
#edDeg{width:78px; font-family:ui-monospace,Consolas,monospace;}
#edInfo{color:var(--dim); font-size:12px;}
/* ---- 历史面板 ---- */
#hist{display:none; position:fixed; right:12px; top:52px; width:300px; max-height:70vh; overflow:auto;
      background:var(--panel); border:1px solid var(--line); border-radius:10px; z-index:20;
      box-shadow:0 8px 30px rgba(0,0,0,.5);}
#hist.on{display:block;}
#hist .hd{padding:8px 12px; border-bottom:1px solid var(--line); font-weight:600;
          display:flex; justify-content:space-between; align-items:center;}
#hist .hd button{padding:2px 8px; font-size:12px;}
.hi{display:flex; gap:8px; align-items:center; padding:8px 12px; cursor:pointer; font-size:12.5px;}
.hi:hover{background:#1a2330;}
.hi .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hi .meta{color:var(--dim); font-size:11px;}
.hi .del{color:#8a5a5a; padding:0 6px;}
.hi .del:hover{color:var(--bad); background:transparent;}
#toast{position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:#1c2634;
       border:1px solid var(--line); color:var(--tx); padding:9px 16px; border-radius:10px;
       font-size:13px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;}
#toast.on{opacity:1;}
@keyframes attnPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(255,212,94,0);} 50%{box-shadow:0 0 0 6px rgba(255,212,94,.35);} }
#bDir.attn{ border-color:var(--sel); animation:attnPulse 1.4s ease-in-out 4; }
/* ---- 选中块照片预览浮窗 ---- */
#peek{display:none; position:absolute; right:12px; bottom:12px; background:#0b0f14;
      border:1px solid var(--line); border-radius:10px; padding:6px; z-index:15;
      box-shadow:0 6px 24px rgba(0,0,0,.55);}
#peek.on{display:block;}
#peek canvas{display:block; border-radius:6px; background:#060a10;}
#peekInfo{font:12px ui-monospace,Consolas,monospace; color:var(--sel); text-align:center; padding-top:4px;}
/* ---- 模式水印（移动模式提示） ---- */
#modeHint{display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%);
          background:rgba(42,58,80,.92); border:1px solid #3d5273; color:#cfe4ff;
          padding:5px 14px; border-radius:16px; font-size:12px; z-index:14; pointer-events:none;}
</style>
</head>
<body>

<div id="bar">
  <button id="bOpen">📁 打开照片</button>
  <button id="bAuto">⚡ 自动标注</button>
  <button id="bExport" class="pri">⬇ 导出 JSON</button>
  <button id="bImport">⬆ 导入</button>
  <button id="bDir">💾 落库目录</button>
  <span id="dirDot" title="落库状态" style="width:9px;height:9px;border-radius:50%;background:#3a4656;display:inline-block"></span>
  <span id="ocrBadge" title="OCR 引擎（点击重新检测 RapidOCR 服务）" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px;color:var(--dim)">
    <span id="ocrDot" style="width:9px;height:9px;border-radius:50%;background:#3a4656;display:inline-block"></span>OCR
  </span>
  <button id="bHist">🕘 历史</button>
  <span class="name" id="phName">未打开照片</span>
  <span id="stat"></span>
  <span style="flex:1"></span>
  <button id="bMode" title="切换 框选/移动">✥ 移动</button>
  <button id="bZoomOut">−</button><button id="bZoomIn">＋</button><button id="bFit">⤢</button>
</div>

<div id="main">
  <div id="stage"><canvas id="cv"></canvas>
    <div id="modeHint">✥ 移动视图模式 —— 拖动平移照片 · 点击拼图块仍可选中编辑</div>
    <div id="peek"><canvas id="peekCv" width="236" height="236"></canvas><div id="peekInfo">—</div></div>
  </div>
  <div id="side">
    <div class="hd"><span>块列表</span><span id="pCount">0</span></div>
    <div id="plist"></div>
    <div id="hint"><b>沿块的斜对角拖一条线</b> → 松手自动生成贴合的旋转矩形，并自动识别框内编号<br>选中后：拖框移动 · 拖顶部圆点旋转 · 拖右下角方块缩放<br>编号未读出/读错时在底部编辑条手输</div>
  </div>
</div>

<div id="edbar">
  <span id="edInfo">块 #1</span>
  <input id="edLabel" placeholder="如 B-287" autocomplete="off">
  <input id="edDeg" title="旋转角度（度）" autocomplete="off">
  <button id="bOk" class="pri">✓ 确认</button>
  <button id="bReocr" title="对本框重新跑 OCR（连接 RapidOCR 服务时为高精度）">🔍 识别</button>
  <button id="bDel" style="color:#ffb0b0">🗑 删除框</button>
  <span style="flex:1"></span>
  <button id="bPrev">◀ 上一块</button><button id="bNext">下一块 ▶</button>
</div>

<div id="hist">
  <div class="hd"><span>标注历史（本机自动保存）</span><button id="hClose">✕</button></div>
  <div id="hlist"></div>
</div>

<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" style="display:none">
<input type="file" id="fApply" accept="image/*" style="display:none">
<input type="file" id="fJson" accept="application/json,.json" style="display:none">

<script src="ocr-templates.js"></script>
<script src="ocr-core.js"></script>
<!-- 全量标注数据快照（落库时自动生成；file:// 下可直接读，无需任何授权）。
     不存在时 404 静默，历史走其它数据源。 -->
<script src="labels-data.js"></script>
<script>
"use strict";
/* ================= 拼图标注台 =================
   单文件夹、双击即用（file://）。自动标注 = 块级连通域(1500) + 编号OCR(3072) + 落框归属；
   人工补框/改号/确认；localStorage 按照片名自动存历史；导出合并 JSON（原图坐标 bbox）。 */

var $=function(id){ return document.getElementById(id); };
var cv=$("cv"), ctx=cv.getContext("2d");
var PW=1500;                       // 块检测/显示工作分辨率（长边）
var ocrK=1;                        // OCR(3072) → 工作分辨率 坐标换算

var P={ img:null, name:"", ow:0, oh:0, W:0, H:0, base:null,
        pieces:[], nextId:1, sel:-1,
        zoom:1, ox:0, oy:0, fit:1, mode:"box", ocrW:0 };
var histPending="";                // 历史点击后等待用户选对应照片

function toast(s,long){
  var t=$("toast"); t.textContent=s; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); }, long?4200:2200);
}
function normLabel(v){
  var s=String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  var m=s.match(/^([ABCD])(\d{1,4})$/);
  return m ? m[1]+"-"+m[2] : null;
}
function fmtT(ts){
  var d=new Date(ts);
  function p(n){ return (n<10?"0":"")+n; }
  return (d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

/* ================= 照片载入 ================= */
$("bOpen").addEventListener("click",function(){ $("fImg").click(); });
$("fImg").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  openPhoto(f); e.target.value="";
});
var stage=$("stage");
stage.addEventListener("dragover",function(e){ e.preventDefault(); });
stage.addEventListener("drop",function(e){
  e.preventDefault();
  var f=e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f&&/^image\//.test(f.type)) openPhoto(f);
});

function openPhoto(file){
  loadPhotoBlob(file, file.name, null);
}
// 统一照片加载入口：blob/file → img；prefetched 为历史点击时已读好的标注数据
function loadPhotoBlob(blob, name, prefetched){
  var url=URL.createObjectURL(blob);
  var img=new Image();
  img.onload=function(){
    URL.revokeObjectURL(url);
    // 照片双保险：IndexedDB 缓存（本机快）+ 落库目录副本（换浏览器/清缓存后仍可恢复）
    idbSet("img:"+name, blob).catch(function(){});
    persistPhotoImage(name, blob);
    setupPhoto(img, name, prefetched);
  };
  img.onerror=function(){ toast("图片加载失败"); };
  img.src=url;
  histPending="";
}
async function setupPhoto(img, name, prefetched){
  P.img=img; P.name=name; P.ow=img.width; P.oh=img.height;
  // canvas 污染实测（file:// 相对路径 <img> 直读会污染）：污染时 OCR 走服务端代读文件
  try{
    var t=document.createElement("canvas"); t.width=1; t.height=1;
    t.getContext("2d").drawImage(img,0,0,1,1); t.toDataURL();
    P.tainted=false;
  }catch(err){ P.tainted=true; }
  var sc=Math.min(1, PW/Math.max(img.width,img.height));
  P.W=Math.round(img.width*sc); P.H=Math.round(img.height*sc);
  var pc=document.createElement("canvas");
  pc.width=P.W; pc.height=P.H;
  pc.getContext("2d").drawImage(img,0,0,P.W,P.H);
  P.base=pc;
  ocrK=P.W/Math.round(img.width*Math.min(1,3072/Math.max(img.width,img.height)));
  // 数据优先级：历史点击预取 > 落库目录文件 > labels-data.js 快照 > 本机旧缓存
  var saved=prefetched || await loadFromDir(name) || ALL_DATA[name] || loadLocal(name);
  P.pieces=[]; P.nextId=1; P.sel=-1;
  fitView();
  if(saved){ applyData(saved); toast("已恢复标注 "+saved.pieces.length+" 块"); renderAll(); }
  else { renderAll(); autoLabel(); }
}

/* ================= 块级连通域（亮前景） ================= */
function pieceBoxes(){
  var c2=document.createElement("canvas");
  c2.width=P.W; c2.height=P.H;
  var cx=c2.getContext("2d",{willReadFrequently:true});
  cx.drawImage(P.img,0,0,P.W,P.H);
  var d=cx.getImageData(0,0,P.W,P.H).data;
  var w=P.W,h=P.H,n=w*h,gray=new Uint8Array(n);
  for(var i=0,p=0;i<n;i++,p+=4) gray[i]=(d[p]*.299+d[p+1]*.587+d[p+2]*.114)|0;
  var hist=new Array(256).fill(0);
  for(i=0;i<n;i++) hist[gray[i]]++;
  var thr=otsuOf(hist,n);
  var fg=new Uint8Array(n);
  for(i=0;i<n;i++) fg[i]=gray[i]>thr?1:0;
  var label=new Int32Array(n), stack=new Int32Array(n), boxes=[];
  var cur=0;
  for(var s=0;s<n;s++){
    if(!fg[s]||label[s]) continue;
    cur++; var top=0; stack[top++]=s; label[s]=cur;
    var cnt=0,x0=w,x1=0,y0=h,y1=0;
    while(top>0){
      var q=stack[--top]; cnt++;
      var qx=q%w,qy=(q/w)|0;
      if(qx<x0)x0=qx; if(qx>x1)x1=qx; if(qy<y0)y0=qy; if(qy>y1)y1=qy;
      if(qx>0){var a=q-1; if(fg[a]&&!label[a]){label[a]=cur;stack[top++]=a;}}
      if(qx<w-1){var b=q+1; if(fg[b]&&!label[b]){label[b]=cur;stack[top++]=b;}}
      if(qy>0){var c3=q-w; if(fg[c3]&&!label[c3]){label[c3]=cur;stack[top++]=c3;}}
      if(qy<h-1){var e3=q+w; if(fg[e3]&&!label[e3]){label[e3]=cur;stack[top++]=e3;}}
    }
    var bw=x1-x0+1,bh=y1-y0+1;
    if(cnt>n*0.008 && bw>w*0.08 && bh>h*0.08 && cnt<n*0.75) boxes.push({bbox:[x0,y0,bw,bh], cnt:cnt});
  }
  return boxes;
}

/* ================= 高精度 OCR 服务（可选，RapidOCR） =================
   label/start-ocr-server.bat 启动本机服务（127.0.0.1:8849）后自动启用；
   未启动则回退内置模板 OCR。file:// 页面跨源 fetch 由服务端 CORS 放行。 */
var OSVC={ host:"http://127.0.0.1:8849", ok:false, checking:false };
function updateOcrBadge(){
  var d=$("ocrDot");
  d.style.background=OSVC.ok?"var(--ok)":"#3a4656";
  d.title=OSVC.ok?"高精度（RapidOCR 服务已连接）":"内置模板（未检测到 RapidOCR 服务）";
  $("ocrBadge").style.color=OSVC.ok?"var(--tx)":"var(--dim)";
}
function probeOcrSvc(){
  if(OSVC.checking) return;
  OSVC.checking=true;
  var ctl=new AbortController(), t=setTimeout(function(){ ctl.abort(); },1500);
  fetch(OSVC.host+"/health",{signal:ctl.signal})
    .then(function(r){ return r.json(); })
    .then(function(j){ OSVC.ok=!!j.ok; })
    .catch(function(){ OSVC.ok=false; })
    .then(function(){ OSVC.checking=false; clearTimeout(t); updateOcrBadge(); });
}
$("ocrBadge").addEventListener("click",function(){
  probeOcrSvc();
  toast(OSVC.ok?"OCR：高精度（RapidOCR）":"正在检测 RapidOCR 服务…");
});
// "B-241"/"B241"/"B—241" 等 → {letter,digits}
function parseNumText(t){
  if(!t) return null;
  var m=String(t).replace(/\s+/g,"").match(/([A-Da-d])[-–—]?(\d{1,4})/);
  return m ? { letter:m[1].toUpperCase(), digits:m[2] } : null;
}
async function svcOcr(req){                  // req: {img:dataURL} 或 {file:name, roi?}
  var r=await fetch(OSVC.host+"/ocr",{ method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(req) });
  if(!r.ok) throw new Error("OCR 服务 HTTP "+r.status);
  var j=await r.json();
  if(j.error) throw new Error(j.error);
  return j.lines||[];
}
// 送识别的图像来源：canvas 被污染（file:// 直读）时改发文件名，由服务端代读磁盘
function svcReqFor(){
  if(P.tainted) return { file:P.name };
  var c=document.createElement("canvas");      // P.img 是 <img>：先画到 canvas 再导出
  c.width=P.ow; c.height=P.oh;
  c.getContext("2d").drawImage(P.img,0,0);
  return { img:c.toDataURL("image/jpeg",0.92) };
}
// 整图 → 服务结果，转成与 detectNumbers 同构的数组
// （x,y=编号中心，OCR 尺度坐标；ang=行框长边方向；n 恒过质量关）
async function svcResults(img){
  var req=svcReqFor();
  var lines=await svcOcr(req);
  var mw=Math.min(1,3072/Math.max(P.ow,P.oh));
  var s=Math.round(P.ow*mw)/P.ow;             // 原图 → OCR 尺度
  return lines.map(function(l){
    var num=parseNumText(l.text);
    if(!num||!l.box||l.box.length<3) return null;
    var xs=l.box.map(function(p){return p[0];}), ys=l.box.map(function(p){return p[1];});
    var d1=Math.hypot(l.box[1][0]-l.box[0][0], l.box[1][1]-l.box[0][1]);
    var d2=Math.hypot(l.box[2][0]-l.box[1][0], l.box[2][1]-l.box[1][1]);
    var ang = d1>=d2
      ? Math.atan2(l.box[1][1]-l.box[0][1], l.box[1][0]-l.box[0][0])
      : Math.atan2(l.box[2][1]-l.box[1][1], l.box[2][0]-l.box[1][0]);
    return { letter:num.letter, digits:num.digits, conf:l.score,
             x:(Math.min.apply(0,xs)+Math.max.apply(0,xs))/2*s,
             y:(Math.min.apply(0,ys)+Math.max.apply(0,ys))/2*s,
             ang:ang, n:6, svc:true };
  }).filter(Boolean);
}
// 框内识别（裁剪/转正/涂白全部由服务端完成，坐标给原图像素）
async function svcOcrRoi(p){
  var k=P.ow/P.W;
  var req=svcReqFor();
  req.roi={ cx:p.box.cx*k, cy:p.box.cy*k, w:p.box.w*k, h:p.box.h*k,
            ang:p.box.ang, pad:1.3 };
  var lines=await svcOcr(req);
  var best=null;
  lines.forEach(function(l){
    var num=parseNumText(l.text);
    if(num&&(!best||l.score>best.conf)) best={letter:num.letter,digits:num.digits,conf:l.score};
  });
  return best;
}

/* ================= 自动标注 ================= */
// 旋转框角度归一：正方形块对 90° 对称，主轴角折到 [-45°,45°]
function norm90(a){
  var d=a*180/Math.PI;
  d=((d%90)+90)%90;
  if(d>45) d-=90;
  return d*Math.PI/180;
}
function autoLabel(){
  if(!P.img){ toast("先打开照片"); return; }
  toast(OSVC.ok?"正在自动标注（高精度 OCR）…":"正在自动标注…",true);
  setTimeout(function(){ doAutoLabel(); },30);
}
async function doAutoLabel(){
  var boxes;
  try{ boxes=pieceBoxes(); }catch(err){
    toast(P.tainted
      ?"块检测需读取照片像素：请点「💾 落库目录」授权 label 文件夹后重试（画框识别不受影响）"
      :"块检测失败："+err.message, true);
    return;
  }
  var results=[], viaSvc=false;
  if(OSVC.ok){
    try{ results=await svcResults(P.img)||[]; viaSvc=true; }
    catch(err){ toast("高精度 OCR 调用失败，回退内置模板（"+err.message+"）",true); }
  }
  if(!viaSvc){
    try{ results=detectNumbers(P.img)||[]; }catch(err){ results=[]; }
  }
    // 质量过滤：编号至少 4 组件（字母+dash+2 数字）且 conf 达标，滤掉背景纹理误检
    results=results.filter(function(r){ return r.n>=4 && r.conf>=0.45; });
    // 编号（OCR 3072 坐标 → 工作分辨率）→ 块归属
    var n=P.W*P.H;
    var byBox=boxes.map(function(){ return []; });
    var orphans=[];
    results.forEach(function(r){
      var x=r.x*ocrK, y=r.y*ocrK, hit=-1;
      for(var b=0;b<boxes.length;b++){
        var bb=boxes[b].bbox, pad=Math.max(bb[2],bb[3])*0.12;
        if(x>=bb[0]-pad&&x<=bb[0]+bb[2]+pad&&y>=bb[1]-pad&&y<=bb[1]+bb[3]+pad){ hit=b; break; }
      }
      if(hit<0) orphans.push(r); else byBox[hit].push(r);
    });
    // 小块平均边长（供孤儿编号估框）
    var avgSide=0, smalls=boxes.filter(function(bx){ return bx.cnt<n*0.15; });
    if(smalls.length){
      smalls.forEach(function(bx){ avgSide+=Math.sqrt(bx.cnt); });
      avgSide/=smalls.length;
    } else avgSide=P.W*0.1;
    // 旋转框：{cx,cy,w,h,ang}（工作分辨率坐标）。编号排列主轴 ≈ 块边方向（印刷平行片边）
    function mkRot(cx,cy,w,h,ang){ return {cx:cx,cy:cy,w:w,h:h,ang:ang||0}; }
    var fresh=[];
    function mkPiece(box,r){
      return { id:P.nextId++, box:box, label:r?r.letter+"-"+r.digits:"",
               conf:r?r.conf:0, src:"auto" };
    }
    boxes.forEach(function(bx,b){
      if(keepBoxesOverlap(bx.bbox)) return;      // 与人工框重叠的自动域跳过
      var rs=byBox[b];
      if(rs.length>=2){
        // 域含多个编号（块相邻粘连/堆叠）：按编号位置+均摊块面积拆旋转方框
        var s=Math.sqrt(bx.cnt/rs.length);
        rs.forEach(function(r){
          fresh.push(mkPiece(mkRot(r.x*ocrK, r.y*ocrK, s, s, norm90(r.ang)), r));
        });
      } else if(rs.length===1){
        // 单编号域：域中心+域均摊面积，方向取编号排列轴
        var bb=bx.bbox, s=Math.sqrt(bx.cnt);
        fresh.push(mkPiece(mkRot(bb[0]+bb[2]/2, bb[1]+bb[3]/2, s, s, norm90(rs[0].ang)), rs[0]));
      } else {
        // 无编号域：AABB 兜底，方向 0 待人工转
        var bb2=bx.bbox;
        fresh.push(mkPiece(mkRot(bb2[0]+bb2[2]/2, bb2[1]+bb2[3]/2, bb2[2], bb2[3], 0), null));
      }
    });
    // 未落框的编号：按平均块面积给估算旋转框，供人工校准
    orphans.forEach(function(r){
      var s=avgSide;
      fresh.push(mkPiece(mkRot(r.x*ocrK, r.y*ocrK, s, s, norm90(r.ang)), r));
    });
    // 已有人工确认的块保留不动
    var keep=P.pieces.filter(function(p){ return p.src==="manual"; });
    P.pieces=keep.concat(fresh);
    renderAll();
    var numd=fresh.filter(function(p){ return p.label; }).length;
    toast("自动标注："+fresh.length+" 块，读出编号 "+numd+" 个"+(viaSvc?"（RapidOCR）":""),true);
}
function keepBoxesOverlap(bb){
  return P.pieces.some(function(p){
    if(p.src!=="manual") return false;
    var kb=p.box;
    var m=Math.max(kb.w,kb.h)/2*Math.SQRT2;   // 旋转外接包络
    return !(bb[0]>kb.cx+m||bb[0]+bb[2]<kb.cx-m||bb[1]>kb.cy+m||bb[1]+bb[3]<kb.cy-m);
  });
}
$("bAuto").addEventListener("click",autoLabel);

/* ================= 视图 ================= */
function fitView(){
  var W=stage.clientWidth-16, H=stage.clientHeight-16;
  if(W<40||H<40) return;
  P.fit=Math.min(W/P.W,H/P.H,1.6);
  P.zoom=1; P.ox=0; P.oy=0;
  layout();
}
function layout(){
  // 仅在尺寸变化时赋值：重复赋同值也会清空 canvas 内容
  if(cv.width!==P.W) cv.width=P.W;
  if(cv.height!==P.H) cv.height=P.H;
  var s=P.fit*P.zoom;
  cv.style.width=Math.round(P.W*s)+"px";
  cv.style.height=Math.round(P.H*s)+"px";
  cv.style.transform="translate(calc(-50% + "+Math.round(P.ox)+"px), calc(-50% + "+Math.round(P.oy)+"px))";
}
function zoomAt(cx,cy,nz){
  nz=Math.max(0.3,Math.min(12,nz));
  // 以 stage 中心为原点：屏幕点 ex = Δw·fit·zoom + ox（canvas 中心恒在 stage中心+o）
  // 缩放后同一工作点不动 → ox' = ex - (ex-ox)·k，k=nz/zoom
  var sr=stage.getBoundingClientRect();
  var ex=cx-sr.left-sr.width/2, ey=cy-sr.top-sr.height/2;
  var k=nz/P.zoom;
  P.ox=ex-(ex-P.ox)*k;
  P.oy=ey-(ey-P.oy)*k;
  P.zoom=nz; layout();
}
$("bZoomIn").addEventListener("click",function(){ zoomAt(stage.clientWidth/2+stage.getBoundingClientRect().left, stage.clientHeight/2+stage.getBoundingClientRect().top, P.zoom*1.3); });
$("bZoomOut").addEventListener("click",function(){ zoomAt(stage.clientWidth/2+stage.getBoundingClientRect().left, stage.clientHeight/2+stage.getBoundingClientRect().top, P.zoom/1.3); });
$("bFit").addEventListener("click",fitView);
window.addEventListener("resize",function(){ if(P.img){ fitView(); } });
stage.addEventListener("wheel",function(e){
  if(!P.img) return;
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,P.zoom*Math.exp(-e.deltaY*0.0016));
},{passive:false});

$("bMode").addEventListener("click",function(){
  P.mode=P.mode==="box"?"pan":"box";
  $("bMode").textContent=P.mode==="box"?"✥ 移动":"▣ 框选";
  $("bMode").classList.toggle("on",P.mode==="pan");
  cv.className=P.mode==="pan"?"pan":"";
  updateModeHint();
});
// 模式水印：移动模式下常驻提示，避免"点了没反应"的困惑
function updateModeHint(){
  var h=$("modeHint");
  if(!h) return;
  h.style.display=(P.mode==="pan"&&P.img)?"block":"none";
}

/* ================= 绘制 ================= */
function boxColor(p,sel){
  if(sel) return "rgba(255,212,94,1)";
  if(p.src==="manual") return "rgba(60,230,120,.95)";
  if(!p.label) return "rgba(255,95,95,.9)";
  if(p.conf<0.6) return "rgba(255,198,40,.95)";
  return "rgba(80,200,255,.9)";
}
function renderAll(){
  if(!P.base) { ctx.clearRect(0,0,cv.width,cv.height); updateModeHint(); return; }
  ctx.clearRect(0,0,P.W,P.H);
  ctx.drawImage(P.base,0,0);
  var anySel=P.sel>=0&&!!P.pieces[P.sel];
  P.pieces.forEach(function(p,i){ drawPiece(p,i,false,anySel); });
  if(anySel){ drawPiece(P.pieces[P.sel],P.sel,true,false); updatePeek(P.pieces[P.sel]); }
  else $("peek").classList.remove("on");
  updateModeHint();
  if(drag&&drag.drawing){
    // 拖拽显示为对角线（两端点），松手自动成旋转矩形
    ctx.strokeStyle="rgba(255,212,94,.95)"; ctx.lineWidth=Math.max(2,P.W/600);
    ctx.setLineDash([10,7]);
    ctx.beginPath(); ctx.moveTo(drag.x0,drag.y0); ctx.lineTo(drag.x1,drag.y1); ctx.stroke();
    ctx.setLineDash([]);
    [drag.x0,drag.x1].forEach(function(px,i){
      ctx.beginPath(); ctx.arc(i? drag.x1:drag.x0, i? drag.y1:drag.y0, Math.max(5,P.W/220), 0, Math.PI*2);
      ctx.fillStyle="rgba(255,212,94,.95)"; ctx.fill();
    });
    // 半透明预览：以对角线为对角的旋转正方形
    var pv=diagBox(drag.x0,drag.y0,drag.x1,drag.y1);
    if(pv){
      ctx.save();
      ctx.translate(pv.cx,pv.cy); ctx.rotate(pv.ang);
      ctx.strokeStyle="rgba(255,212,94,.45)"; ctx.lineWidth=Math.max(1.5,P.W/800);
      ctx.strokeRect(-pv.w/2,-pv.h/2,pv.w,pv.h);
      ctx.restore();
    }
  }
  updateSide(); updateStat();
}
function drawPiece(p,i,sel,dim){        // dim=有其他框被选中：未确认标签淡出，还视线给选中区
  var b=p.box, col=boxColor(p,sel);
  ctx.save();
  ctx.translate(b.cx,b.cy);
  ctx.rotate(b.ang);
  ctx.strokeStyle=col;
  ctx.lineWidth=sel?Math.max(3,P.W/400):Math.max(1.6,P.W/800);
  if(sel){ ctx.shadowColor="rgba(255,212,94,.8)"; ctx.shadowBlur=10; }
  ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
  ctx.shadowBlur=0;
  // 方向指示：从中心指向「编号起始端」的短线（w 轴正方向）
  if(sel){
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(b.w/2,0);
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(2,P.W/600);
    ctx.setLineDash([6,5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  // 标签：旋转框最高点上方（水平书写）。密集场景防遮挡：
  //  选中 = 完整信息（#序号 编号 conf）+ 深底衬；
  //  未选中且未确认 = 只显示编号，小字号 + 半透明底衬；
  //  已人工确认 = 不画文字，只留 ✓ 角标（信息在侧栏都有，把照片还给眼睛）。
  var hw=Math.abs(b.w*Math.cos(b.ang))+Math.abs(b.h*Math.sin(b.ang));
  var hh=Math.abs(b.w*Math.sin(b.ang))+Math.abs(b.h*Math.cos(b.ang));
  var topY=b.cy-hh/2;
  var confirmed=(p.src==="manual"&&p.label);
  var showText = sel || (!confirmed && !!p.label);
  var fs=sel?Math.max(13,Math.min(26,P.W/60)):Math.max(10,Math.min(16,P.W/95));
  if(showText){
    var txt=sel ? ("#"+(i+1)+"  "+(p.label||"? ? ?")) : p.label;
    ctx.font="bold "+fs+"px ui-monospace,Consolas,monospace";
    var tw=ctx.measureText(txt).width;
    var ly=Math.max(fs+4,topY-6);
    ctx.fillStyle=sel?"rgba(6,10,16,.82)":(dim?"rgba(6,10,16,.18)":"rgba(6,10,16,.42)");
    ctx.fillRect(b.cx-tw/2-5,ly-fs-3,tw+10,fs+6);
    ctx.globalAlpha=dim?0.4:1;
    ctx.fillStyle=col;
    ctx.textBaseline="alphabetic"; ctx.textAlign="left";
    ctx.fillText(txt,b.cx-tw/2,ly-2);
    ctx.globalAlpha=1;
  }
  if(sel){
    // 旋转柄：顶中点向上伸出的圆点；缩放柄：右下角小方块（均在旋转坐标系里）
    ctx.save();
    ctx.translate(b.cx,b.cy); ctx.rotate(b.ang);
    var hs=Math.max(9,P.W/110);
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,P.W/900);
    ctx.beginPath();
    ctx.moveTo(0,-b.h/2); ctx.lineTo(0,-b.h/2-hs*1.4);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-b.h/2-hs*1.4,hs*0.55,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    ctx.fillStyle="#0b0f14";
    ctx.fillRect(b.w/2-hs/2, b.h/2-hs/2, hs, hs);
    ctx.strokeRect(b.w/2-hs/2, b.h/2-hs/2, hs, hs);
    ctx.restore();
    // 选中块的 conf 补充到标签行（若有自动置信）
    if(p.conf&&p.src!=="manual"){
      ctx.fillStyle="rgba(255,255,255,.85)";
      ctx.font="11px system-ui";
      ctx.textAlign="center";
      ctx.fillText((p.conf*100|0)+"%",b.cx,topY-fs-10);
      ctx.textAlign="left";
    }
  }
  // 人工确认小勾
  if(confirmed&&!sel){
    ctx.fillStyle="rgba(60,230,120,.95)";
    ctx.font="bold "+Math.max(11,P.W/130)+"px system-ui";
    ctx.fillText("✓",b.cx+hw/2-Math.max(11,P.W/130)*1.2,b.cy-hh/2+Math.max(11,P.W/130));
  }
}
/* 选中框的干净预览：按框角度旋转裁剪原图（无任何标注遮挡），右下角浮窗显示 */
function updatePeek(p){
  var el=$("peek");
  if(!p||!P.img){ el.classList.remove("on"); return; }
  el.classList.add("on");
  var pc=$("peekCv"), c=pc.getContext("2d");
  var k=P.ow/P.W;                              // 工作 → 原图像素
  var bw=Math.max(2,p.box.w*k), bh=Math.max(2,p.box.h*k);
  var m=1.3;                                   // 四周留 30% 边距，顺带看清邻块边界
  var s=Math.min(pc.width/(bw*m), pc.height/(bh*m));
  c.fillStyle="#060a10"; c.fillRect(0,0,pc.width,pc.height);
  c.save();
  c.translate(pc.width/2,pc.height/2);
  c.rotate(-p.box.ang);                        // 框转正：块在预览里是正立的
  c.scale(s,s);
  c.imageSmoothingQuality="high";
  c.drawImage(P.img, -p.box.cx*k, -p.box.cy*k);
  c.restore();
  $("peekInfo").textContent=(p.label||"（缺编号）")
    +(p.conf?" · "+(p.conf*100|0)+"%":"")
    +(p.src==="manual"?" · 已确认":" · 未确认");
}
function updateStat(){
  var tot=P.pieces.length, man=0, empty=0;
  P.pieces.forEach(function(p){ if(p.src==="manual")man++; if(!p.label)empty++; });
  $("stat").innerHTML="共 <b>"+tot+"</b> 块 · 已确认 <b>"+man+"</b> · 缺编号 <b"+(empty?' style="color:var(--bad)"':"")+">"+empty+"</b>";
  $("phName").textContent=P.name||"未打开照片";
}
function updateSide(){
  $("pCount").textContent=P.pieces.length;
  var html="";
  P.pieces.forEach(function(p,i){
    var c=boxColor(p,i===P.sel);
    html+='<div class="pi'+(i===P.sel?" sel":"")+'" data-k="'+i+'">'
      +'<span class="dot" style="background:'+(p.label?(p.src==="manual"?"var(--ok)":"var(--auto)"):"var(--bad)")+'"></span>'
      +'<span class="lb" style="color:'+(i===P.sel?"var(--sel)":"var(--tx)")+'">'+(p.label||"（缺编号）")+'</span>'
      +'<span class="cf">'+(p.conf?(p.conf*100|0)+"%":"")+'</span></div>';
  });
  $("plist").innerHTML=html;
}
$("plist").addEventListener("click",function(e){
  var el=e.target.closest?e.target.closest(".pi"):null; if(!el) return;
  selectPiece(parseInt(el.dataset.k,10));
});

/* ================= 选择与编辑 ================= */
function selectPiece(i){
  P.sel=(i>=0&&i<P.pieces.length)?i:-1;
  renderAll();
  if(P.sel>=0){
    $("edbar").classList.add("on");
    var p=P.pieces[P.sel];
    var deg=Math.round(p.box.ang*180/Math.PI*10)/10;
    $("edInfo").textContent="块 #"+(P.sel+1)
      +(p.conf&&p.src!=="manual"?" · 自动 conf "+(p.conf*100|0)+"%":"")
      +" · "+Math.round(p.box.w)+"×"+Math.round(p.box.h);
    $("edLabel").value=p.label;
    $("edDeg").value=deg+"°";
    setTimeout(function(){ $("edLabel").focus(); $("edLabel").select(); },40);
  } else $("edbar").classList.remove("on");
}
function commitLabel(ok){
  if(P.sel<0) return;
  var p=P.pieces[P.sel];
  if(ok){
    var nl=normLabel($("edLabel").value);
    if(!nl){ toast("编号格式：字母 A-D + 数字，如 B-287"); $("edLabel").focus(); return; }
    p.label=nl; p.src="manual"; p.conf=1;
  }
  if(ok){
    var ni=nextEmpty(P.sel+1);
    selectPiece(ni);                       // 没有未确认块时 ni=-1 → 编辑条关闭
    if(ni<0) toast("全部块已确认完成 🎉");
  } else selectPiece(P.sel);
  saveSoon(); renderAll();
}
// 下一个/上一个「未确认」块；全部确认完返回 -1（关闭编辑条，不停在已确认块上）
function nextEmpty(from){
  for(var d=0;d<P.pieces.length;d++){
    var i=(from+d)%P.pieces.length;
    if(P.pieces[i].src!=="manual"||!P.pieces[i].label) return i;
  }
  return -1;
}
function prevEmpty(from){
  for(var d=P.pieces.length-1;d>=0;d--){
    var i=(from+d)%P.pieces.length;
    if(P.pieces[i].src!=="manual"||!P.pieces[i].label) return i;
  }
  return -1;
}
$("bOk").addEventListener("click",function(){ commitLabel(true); });
$("edLabel").addEventListener("keydown",function(e){
  if(e.key==="Enter") commitLabel(true);
});
$("edDeg").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    if(P.sel<0) return;
    var v=parseFloat(String($("edDeg").value).replace(/[^0-9.\-]/g,""));
    if(!isNaN(v)){
      P.pieces[P.sel].box.ang=v*Math.PI/180;
      P.pieces[P.sel].src="manual";
      saveSoon(); renderAll();
    }
    $("edLabel").focus();
  }
});
$("bDel").addEventListener("click",function(){
  if(P.sel<0) return;
  P.pieces.splice(P.sel,1);
  selectPiece(-1); saveSoon(); renderAll();
});
$("bReocr").addEventListener("click",function(){
  if(P.sel<0||!P.img) return;
  toast("正在识别框 #"+(P.sel+1)+"…");
  setTimeout(function(){ localOCR(P.pieces[P.sel]); },30);
});
$("bPrev").addEventListener("click",function(){ if(P.pieces.length) selectPiece(prevEmpty(P.sel<0?P.pieces.length-1:P.sel-1)); });
$("bNext").addEventListener("click",function(){ if(P.pieces.length) selectPiece(nextEmpty(P.sel+1)); });

/* ================= 指针交互：画框 / 移动 / 旋转 / 缩放 / 平移 ================= */
var drag=null;
function toWork(e){
  var r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*P.W/r.width, y:(e.clientY-r.top)*P.H/r.height };
}
// 点是否在旋转框内（反旋转到局部坐标）
function inRotBox(b,x,y){
  var dx=x-b.cx, dy=y-b.cy;
  var c=Math.cos(-b.ang), s=Math.sin(-b.ang);
  var lx=dx*c-dy*s, ly=dx*s+dy*c;
  return Math.abs(lx)<=b.w/2 && Math.abs(ly)<=b.h/2;
}
function hitPiece(x,y){
  for(var i=P.pieces.length-1;i>=0;i--){
    if(inRotBox(P.pieces[i].box,x,y)) return i;
  }
  return -1;
}
// 屏幕像素阈值 → 工作坐标
function handleR(){ return Math.max(9,P.W/110)/(P.fit*P.zoom); }
// 选中框的柄命中：0=无 1=旋转柄(顶中伸出) 2=缩放柄(右下角)
function hitHandle(p,x,y){
  var b=p.box, hr=handleR()*1.6;
  var dx=x-b.cx, dy=y-b.cy;
  var c=Math.cos(-b.ang), s=Math.sin(-b.ang);
  var lx=dx*c-dy*s, ly=dx*s+dy*c;
  var ry=-b.h/2-handleR()*1.4;
  if(Math.hypot(lx-0,ly-ry)<hr) return 1;
  if(Math.abs(lx-b.w/2)<hr && Math.abs(ly-b.h/2)<hr) return 2;
  return 0;
}
cv.addEventListener("pointerdown",function(e){
  if(!P.img) return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  var w=toWork(e);
  if(P.mode==="pan"||e.button===1){
    drag={ kind:"pan", sx:e.clientX, sy:e.clientY, ox:P.ox, oy:P.oy };
    return;
  }
  // 选中块的柄优先（旋转/缩放）
  if(P.sel>=0&&P.pieces[P.sel]){
    var h=hitHandle(P.pieces[P.sel],w.x,w.y);
    if(h===1){ drag={ kind:"rot", id:P.pieces[P.sel].id }; return; }
    if(h===2){ drag={ kind:"scale", id:P.pieces[P.sel].id, w0:P.pieces[P.sel].box.w, d0:Math.hypot(w.x-P.pieces[P.sel].box.cx, w.y-P.pieces[P.sel].box.cy) }; return; }
  }
  var hit=hitPiece(w.x,w.y);
  if(hit>=0&&hit!==P.sel){ selectPiece(hit); drag={ kind:"move", id:P.pieces[hit].id, sx:w.x, sy:w.y, bb:cloneBox(P.pieces[hit].box), moved:false }; return; }
  if(hit>=0&&hit===P.sel){ drag={ kind:"move", id:P.pieces[hit].id, sx:w.x, sy:w.y, bb:cloneBox(P.pieces[hit].box), moved:false }; return; }
  drag={ kind:"draw", x0:w.x, y0:w.y, x1:w.x, y1:w.y, drawing:false };
});
function cloneBox(b){ return {cx:b.cx,cy:b.cy,w:b.w,h:b.h,ang:b.ang}; }
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  if(drag.kind==="pan"){
    P.ox=drag.ox+(e.clientX-drag.sx); P.oy=drag.oy+(e.clientY-drag.sy); layout(); return;
  }
  var w=toWork(e);
  var p=P.pieces.find(function(q){ return q.id===drag.id; });
  if(drag.kind==="move"){
    if(!p) return;
    var dx=w.x-drag.sx, dy=w.y-drag.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
    p.box.cx=drag.bb.cx+dx; p.box.cy=drag.bb.cy+dy;
    p.src="manual";
    renderAll();
  } else if(drag.kind==="rot"){
    if(!p) return;
    p.box.ang=Math.atan2(w.y-p.box.cy, w.x-p.box.cx)+Math.PI/2;
    p.src="manual";
    renderAll();
  } else if(drag.kind==="scale"){
    if(!p) return;
    var d1=Math.hypot(w.x-p.box.cx, w.y-p.box.cy);
    var k=drag.d0>4?d1/drag.d0:1;
    p.box.w=Math.max(20,drag.w0*k); p.box.h=p.box.w;   // 块近方形：等比
    p.src="manual";
    renderAll();
  } else {
    drag.x1=w.x; drag.y1=w.y;
    if(Math.abs(drag.x1-drag.x0)>6||Math.abs(drag.y1-drag.y0)>6) drag.drawing=true;
    renderAll();
  }
});
function endDrag(e){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.kind==="pan"){
    // 移动模式下几乎无位移的"点击"仍可选中框：拖动=平移视图，点框=查看/编辑
    if(P.img && Math.hypot(e.clientX-d.sx, e.clientY-d.sy)<5){
      var pw=toWork(e), phit=hitPiece(pw.x,pw.y);
      if(phit>=0) selectPiece(phit);
    }
    return;
  }
  if(d.kind==="draw"&&d.drawing){
    var nb=diagBox(d.x0,d.y0,d.x1,d.y1);
    if(nb){
      var np={ id:P.nextId++, box:nb, label:"", conf:0, src:"manual" };
      P.pieces.push(np);
      saveSoon(); renderAll();
      selectPiece(P.pieces.length-1);
      toast("已生成矩形，正在识别框内编号…");
      setTimeout(function(){ localOCR(np); },30);
    } else {
      // 太短被当误触丢弃：必须给反馈，否则用户不知道为什么没有框
      toast("对角线太短（不足照片宽 4%），放大后再画", true);
    }
  } else if((d.kind==="move"&&d.moved)||d.kind==="rot"||d.kind==="scale"){
    saveSoon(); renderAll();
  }
}
// 对角线两端点 → 旋转正方形（拼图块近方形）：
// 中心=中点，边长=对角线/√2，角度=对角线角-45°
function diagBox(x0,y0,x1,y1){
  var d=Math.hypot(x1-x0,y1-y0);
  if(d<P.W*0.04) return null;                 // 太短当误触
  var s=d/Math.SQRT2;
  var ang=Math.atan2(y1-y0,x1-x0)-Math.PI/4;
  return { cx:(x0+x1)/2, cy:(y0+y1)/2, w:s, h:s, ang:ang };
}
// 画完框后局部 OCR：把框内区域转正裁出（OCR 尺度+大量补白），识别编号自动填入
// 优先走 RapidOCR 服务（cls 自动处理倒立），失败/未启动回退内置模板 OCR（含 180° 重试）
async function localOCR(p){
  if(!p||!P.img) return;
  var b=p.box, k=P.ow/P.W;                    // 工作 → 原图
  var kocr=Math.min(1, 3072/Math.max(P.ow,P.oh));   // 原图 → OCR 尺度（与全图识别一致）
  var z=kocr*1.6;                             // 局部放大 1.6×：字符更大更易匹配（画布同步加大保持聚类半径窗口）
  var side=Math.max(2600, Math.ceil(b.w*k*z*1.4));  // 块区居中+涂白（dmax=26·side/1500 需 > 字符间距·z）
  var cv2=document.createElement("canvas");
  cv2.width=side; cv2.height=side;
  var c2=cv2.getContext("2d",{willReadFrequently:true});
  c2.fillStyle="#f5f2ea"; c2.fillRect(0,0,side,side);   // 界外白底
  c2.save();
  c2.translate(side/2, side/2);
  c2.rotate(-b.ang);
  c2.scale(z,z);
  c2.drawImage(P.img, -b.cx*k, -b.cy*k);
  c2.restore();
  // 框外涂白（evenodd 挖洞，留 30% 余量防框稍偏裁掉编号）——避免邻近块的编号混入
  var inW=b.w*k*z*1.3, inH=b.h*k*z*1.3;
  c2.save();
  c2.translate(side/2, side/2);
  c2.rotate(-b.ang);
  c2.fillStyle="#f5f2ea";
  c2.beginPath();
  c2.rect(-side, -side, side*2, side*2);
  c2.rect(-inW/2, -inH/2, inW, inH);
  c2.fill("evenodd");
  c2.restore();
  var best=null, viaSvc=false;
  function pick(res){
    res.forEach(function(r){
      if(r.n>=4&&r.conf>=0.4&&(!best||r.conf>best.conf)) best=r;
    });
  }
  if(OSVC.ok){
    try{
      best=await svcOcrRoi(p);               // 裁剪/转正/涂白在服务端完成
      if(best) viaSvc=true;
    }catch(err){ toast("高精度 OCR 调用失败，改用内置模板（"+err.message+"）",true); }
  }
  if(!best){
    try{ pick(detectNumbers(cv2)); }catch(err){}
    if(!best){
      // 倒立重试：编号相对块可能转了 180°（块方向无极性）
      try{
        var cv3=document.createElement("canvas");
        cv3.width=side; cv3.height=side;
        var c3=cv3.getContext("2d");
        c3.translate(side/2,side/2); c3.rotate(Math.PI);
        c3.drawImage(cv2,-side/2,-side/2);
        pick(detectNumbers(cv3));
      }catch(err){}
    }
  }
  if(best){
    p.label=best.letter+"-"+best.digits;
    p.conf=best.conf;
    // 重识别成功后回到「未确认」态：需要人工再核一遍才算数
    p.src="auto";
    // 识别结果回填编辑条输入框（该块仍被选中时），聚焦方便直接回车确认
    if(P.sel>=0&&P.pieces[P.sel]===p){
      $("edLabel").value=p.label;
      $("edInfo").textContent="块 #"+(P.sel+1)
        +" · 自动 conf "+(p.conf*100|0)+"%"
        +" · "+Math.round(p.box.w)+"×"+Math.round(p.box.h);
      $("edLabel").focus(); $("edLabel").select();
    }
    toast("框 #"+(P.pieces.indexOf(p)+1)+" 识别："+p.label+"（"+(best.conf*100|0)+"%）"
      +(viaSvc?" · RapidOCR":"")+(p.conf<0.65?" · 建议核对":""));
  } else {
    toast("框 #"+(P.pieces.indexOf(p)+1)+" 未读出编号，请手输",true);
  }
  saveSoon(); renderAll();
}

cv.addEventListener("pointercancel",function(){ drag=null; });
// 中键按下会触发浏览器「自动滚动」，必须在 mousedown 阶段拦掉

/* ================= 历史（localStorage） ================= */
var LS="plabel:";
function origBox(b){                      // 工作分辨率 → 原图像素
  var k=P.ow/P.W;
  return { cx:Math.round(b.cx*k), cy:Math.round(b.cy*k),
           w:Math.round(b.w*k), h:Math.round(b.h*k), ang:Math.round(b.ang*1000)/1000 };
}
function workBox(b){                      // 原图像素 → 工作分辨率
  var k=P.W/P.ow;
  return { cx:b.cx*k, cy:b.cy*k, w:b.w*k, h:b.h*k, ang:b.ang||0 };
}
function dataNow(){
  return { version:2, photo:P.name, width:P.ow, height:P.oh, updated:Date.now(),
    pieces:P.pieces.map(function(p){
      return { box:origBox(p.box), label:p.label, conf:Math.round(p.conf*100)/100, src:p.src };
    }) };
}
function applyData(d){
  P.ow=d.width||P.ow; P.oh=d.height||P.oh;
  P.pieces=(d.pieces||[]).map(function(p){
    var wb;
    if(p.box) wb=workBox(p.box);
    else {                                // v1 旧格式 AABB 兼容
      var b=workBBoxArr(p.bbox);
      wb={ cx:b[0]+b[2]/2, cy:b[1]+b[3]/2, w:b[2], h:b[3], ang:0 };
    }
    return { id:P.nextId++, box:wb, label:p.label||"",
             conf:p.conf||0, src:p.src||"auto" };
  });
  P.sel=-1; $("edbar").classList.remove("on");
}
function workBBoxArr(b){
  var k=P.W/P.ow;
  return [b[0]*k, b[1]*k, b[2]*k, b[3]*k];
}
var saveT=null;
function saveSoon(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    if(P.name&&P.pieces.length){
      // 只落文件（落库目录）；不再写 localStorage
      if(dirHandle) persistPhoto(P.name);
      else if(!saveSoon.warned){
        saveSoon.warned=true;
        toast("点「💾 落库目录」选择保存位置（建议 label 文件夹），标注才能落盘",true);
      }
    }
  },600);
}
function toLabelFn(name){
  return String(name).replace(/[\\/:*?"<>|]/g,"_").replace(/\.[^.]+$/,"")+".labels.json";
}
// 全量数据快照：labels-data.js（file:// 下 <script> 可直接读，读取无需任何授权）
// 由落库写入时自动维护；页面启动时若存在则成为默认历史来源。
var ALL_DATA = (typeof LABEL_DATA!=="undefined" && LABEL_DATA) ? LABEL_DATA : {};
function snapshotJs(){
  var head="/* 自动生成：全量标注数据快照（由标注台落库时维护）。请勿手改。 */\nvar LABEL_DATA="+JSON.stringify(ALL_DATA)+";";
  return head;
}
async function writeSnapshot(){
  if(!dirHandle) return;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return;
    var fh=await dirHandle.getFileHandle("labels-data.js",{create:true});
    var w=await fh.createWritable();
    await w.write(snapshotJs());
    await w.close();
  }catch(err){}
}
// 从落库目录读某照片的标注（无目录/无权限/无文件 → null）
async function loadFromDir(name){
  if(!dirHandle) return null;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return null;
    var fh=await dirHandle.getFileHandle(toLabelFn(name));
    return JSON.parse(await (await fh.getFile()).text());
  }catch(err){ return null; }
}
function loadLocal(name){
  var s=localStorage.getItem(LS+name);
  if(!s) return null;
  try{ return JSON.parse(s); }catch(err){ return null; }
}
$("bHist").addEventListener("click",function(){ renderHist(); $("hist").classList.add("on"); });
$("hClose").addEventListener("click",function(){ $("hist").classList.remove("on"); });
function histRow(name, d, src){
  var man=0, emp=0;
  (d.pieces||[]).forEach(function(p){ if(p.src==="manual")man++; if(!p.label)emp++; });
  return { name:name, d:d, src:src, man:man, emp:emp };
}
async function renderHist(){
  var rows=[];
  var seen={};
  // 主源：落库目录里的 *.labels.json（最权威、最新）
  if(dirHandle){
    try{
      var p=await dirHandle.queryPermission({mode:"readwrite"});
      if(p==="granted"){
        var names=[];
        for await (var entry of dirHandle.values()){
          if(entry.kind==="file" && /\.labels\.json$/i.test(entry.name)) names.push(entry.name);
        }
        for(var i=0;i<names.length;i++){
          try{
            var fh=await dirHandle.getFileHandle(names[i]);
            var d=JSON.parse(await (await fh.getFile()).text());
            if(d.pieces){
              var nm=d.photo||names[i].replace(/\.labels\.json$/i,"");
              rows.push(histRow(nm, d, "dir")); seen[nm]=true;
            }
          }catch(err){}
        }
      }
    }catch(err){}
  }
  // 次源：labels-data.js 快照（file:// 下无需授权即可见的默认历史）
  Object.keys(ALL_DATA).forEach(function(nm){
    if(seen[nm]||!ALL_DATA[nm].pieces) return;
    rows.push(histRow(nm, ALL_DATA[nm], "dir")); seen[nm]=true;
  });
  // 兜底：本机旧缓存（迁移前的数据）
  if(!rows.length){
    for(var k=0;k<localStorage.length;k++){
      var key=localStorage.key(k);
      if(key&&key.indexOf(LS)===0){
        try{
          var d2=JSON.parse(localStorage.getItem(key));
          if(d2.pieces){ rows.push(histRow(key.slice(LS.length), d2, "local")); seen[key.slice(LS.length)]=true; }
        }catch(err){}
      }
    }
  }
  rows.sort(function(a,b){ return b.d.updated-a.d.updated; });
  $("hlist").innerHTML=rows.length?rows.map(function(r){
    return '<div class="hi" data-k="'+r.name+'" data-src="'+r.src+'"><span class="nm">'+r.name+'</span>'
      +'<span class="meta">'+r.d.pieces.length+'块 ✓'+r.man+(r.emp?' <span style="color:var(--bad)">缺'+r.emp+'</span>':'')+' · '+fmtT(r.d.updated)+'</span>'
      +'<button class="del" data-del="'+r.name+'">🗑</button></div>';
  }).join(""):'<div class="hi"><span class="meta">暂无历史</span></div>';
}
$("hlist").addEventListener("click",async function(e){
  var del=e.target.dataset&&e.target.dataset.del;
  if(del){
    if(confirm("删除 "+del+" 的标注历史？")){
      if(dirHandle){
        try{
          var p=await dirHandle.queryPermission({mode:"readwrite"});
          if(p==="granted") await dirHandle.removeEntry(toLabelFn(del));
        }catch(err){}
      }
      localStorage.removeItem(LS+del);
      delete ALL_DATA[del];
      writeSnapshot();
      renderHist();
    }
    return;
  }
  var el=e.target.closest?e.target.closest(".hi"):null; if(!el||!el.dataset.k) return;
  var name=el.dataset.k;
  var d = el.dataset.src==="dir" ? (await loadFromDir(name) || ALL_DATA[name]) : loadLocal(name);
  if(!d){ toast("历史数据损坏"); return; }
  if(P.name===name){
    applyData(d); renderAll(); $("hist").classList.remove("on"); toast("已载入 "+d.pieces.length+" 块");
    return;
  }
  // 照片加载链：本机缓存 → 落库目录里的照片副本 → 同目录 <img> 直读 → 让用户选一次
  var blob=await idbGet("img:"+name).catch(function(){ return null; });
  if(!blob) blob=await photoFromDir(name);
  if(blob){
    $("hist").classList.remove("on");
    loadPhotoBlob(blob, name, d);
  } else {
    var im=await imgFromFolder(name);
    if(im){
      $("hist").classList.remove("on");
      setupPhoto(im, name, d);
    } else {
      histPending=name; histPendingData=d;
      $("hist").classList.remove("on");
      toast("本机没有该照片缓存，请选择照片文件："+name,true);
      $("fApply").click();
    }
  }
});
// file:// 同目录直读（相对路径 img 不受 CORS 限制）。注意：此路径下 canvas
// 可能被标记为污染，OCR 自动识别会静默失败（画框/改号不受影响）。
function imgFromFolder(name){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){ res(im); };
    im.onerror=function(){ res(null); };
    im.src=encodeURI(name);
  });
}
var histPendingData=null;
$("fApply").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f||!histPending) return;
  if(f.name!==histPending){ toast("选的是 "+f.name+"，需要 "+histPending,true); return; }
  var d=histPendingData; histPendingData=null;
  var keep=histPending; histPending="";
  loadPhotoBlob(f, keep, d);
});

  if(P.name&&P.pieces.length) persistPhoto(P.name);
  var out={ version:2, exported:new Date().toISOString(), photos:{} };
  // 主源：落库目录文件
  if(dirHandle){
    try{
      var p=await dirHandle.queryPermission({mode:"readwrite"});
      if(p==="granted"){
        var names=[];
        for await (var entry of dirHandle.values()){
          if(entry.kind==="file" && /\.labels\.json$/i.test(entry.name)) names.push(entry.name);
        }
        for(var i=0;i<names.length;i++){
          try{
            var fh=await dirHandle.getFileHandle(names[i]);
            var d=JSON.parse(await (await fh.getFile()).text());
            out.photos[d.photo||names[i].replace(/\.labels\.json$/i,"")]=d;
          }catch(err){}
        }
      }
    }catch(err){}
  }
  // 兜底：本机旧缓存
  for(var k=0;k<localStorage.length;k++){
    var key=localStorage.key(k);
    if(key&&key.indexOf(LS)===0){
      try{ var d2=JSON.parse(localStorage.getItem(key)); out.photos[key.slice(LS.length)]=d2; }catch(err){}
    }
  }
  var n=Object.keys(out.photos).length;
  if(!n){ toast("还没有可导出的标注"); return; }
  var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  var t=new Date();
  a.download="labels-"+t.getFullYear()+(t.getMonth()+1<10?"0":"")+(t.getMonth()+1)
    +(t.getDate()<10?"0":"")+t.getDate()+"-"+(t.getHours()<10?"0":"")+t.getHours()+(t.getMinutes()<10?"0":"")+t.getMinutes()+".json";
  a.href=URL.createObjectURL(blob);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
  toast("已导出 "+n+" 张照片的标注");
});

/* ================= 导入 ================= */
$("bImport").addEventListener("click",function(){ $("fJson").click(); });
$("fJson").addEventListener("change",async function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f) return;
  var fr=new FileReader();
  fr.onload=async function(){
    var d;
    try{ d=JSON.parse(fr.result); }catch(err){ toast("JSON 解析失败"); return; }
    var ph=d.photos||{};
    if(!d.photos&&d.pieces&&d.photo) ph[d.photo]=d;   // 单照片格式也收
    var names=Object.keys(ph);
    if(!names.length){ toast("文件里没有标注数据"); return; }
    // 优先写落库目录文件；无目录时退回本机缓存
    var wrote=0;
    if(dirHandle){
      try{
        var p=await dirHandle.queryPermission({mode:"readwrite"});
        if(p==="granted"){
          for(var i=0;i<names.length;i++){
            try{
              var fh=await dirHandle.getFileHandle(toLabelFn(names[i]),{create:true});
              var w=await fh.createWritable();
              await w.write(JSON.stringify(ph[names[i]],null,1));
              await w.close();
              wrote++;
            }catch(err){}
          }
        }
      }catch(err){}
    }
    if(!wrote){
      names.forEach(function(nm){ localStorage.setItem(LS+nm, JSON.stringify(ph[nm])); });
      toast("已导入 "+names.length+" 条（未连接落库目录，暂存本机）",true);
    } else {
      toast("已导入 "+wrote+" 条到落库目录"+(P.name&&ph[P.name]?"，当前照片已更新":""));
    }
    if(P.name&&ph[P.name]){ applyData(ph[P.name]); renderAll(); }
  };
  fr.readAsText(f);
});

/* ================= 自动落库（File System Access） =================
   选一次目录后，每张图的标注改动自动写成 <照片名>.labels.json（与导出同格式）。
   handle 存 IndexedDB；刷新后若权限仍在则全自动，否则点一下「落库目录」重新授权。 */
var dirHandle=null;
function idbOpen(){
  return new Promise(function(res,rej){
    var r=indexedDB.open("plabel",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function idbSet(k,v){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction("kv","readwrite");
      tx.objectStore("kv").put(v,k);
      tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var req=db.transaction("kv").objectStore("kv").get(k);
      req.onsuccess=function(){ res(req.result); };
      req.onerror=function(){ rej(req.error); };
    });
  });
}
function setDirDot(state){
  var d=$("dirDot");
  d.style.background = state==="on" ? "var(--ok)" : (state==="warn" ? "var(--warn)" : "#3a4656");
}
var fsSupported = typeof window.showDirectoryPicker==="function";
if(!fsSupported) $("bDir").style.display="none";

$("bDir").addEventListener("click",async function(){
  $("bDir").classList.remove("attn");
  try{
    if(dirHandle){
      var p=await dirHandle.queryPermission({mode:"readwrite"});
      if(p!=="granted") p=await dirHandle.requestPermission({mode:"readwrite"});
      if(p==="granted"){ setDirDot("on"); toast("落库目录已连接："+dirHandle.name); persistPhoto(P.name); return; }
    }
    var h=await showDirectoryPicker({mode:"readwrite"});
    dirHandle=h;
    await idbSet("dirHandle",h);
    setDirDot("on");
    toast("已选择落库目录："+h.name+" · 每张图标注将自动保存为 .labels.json",true);
    await rebuildSnapshotFromDir();
    migrateLocal();
    persistPhoto(P.name);
  }catch(err){
    if(err&&err.name==="AbortError") return;
    toast("落库目录不可用："+(err&&err.message||err));
  }
});
async function restoreDir(){
  if(!fsSupported) return;
  try{
    var h=await idbGet("dirHandle");
    if(!h){
      // 新环境（换浏览器/清缓存/首次 file:// 打开）：引导连接数据文件夹
      toast("点「💾 落库目录」选择标注数据文件夹（label），已有标注会自动读回",5000);
      $("bDir").classList.add("attn");
      return;
    }
    dirHandle=h;
    var p=await h.queryPermission({mode:"readwrite"});
    setDirDot(p==="granted"?"on":"warn");
    if(p==="granted"){
      await migrateLocal();
      await rebuildSnapshotFromDir();
      persistPhoto(P.name);
    } else {
      $("bDir").classList.add("attn");
      toast("落库目录需要重新授权：点「💾 落库目录」连接 "+(h.name||"数据文件夹"),5000);
    }
  }catch(err){}
}
// 一次性迁移：本机 localStorage 旧历史 → 落库目录文件（updated 新者胜），迁移完清掉
async function migrateLocal(){
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return;
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(LS)===0) keys.push(k);
    }
    var moved=0;
    for(var j=0;j<keys.length;j++){
      var k2=keys[j];
      var d; try{ d=JSON.parse(localStorage.getItem(k2)); }catch(err){ d=null; }
      if(!d||!d.pieces){ localStorage.removeItem(k2); continue; }
      var nm=d.photo||k2.slice(LS.length);
      var ex=await loadFromDir(nm);
      if(!ex || (d.updated||0)>(ex.updated||0)){
        try{
          var fh=await dirHandle.getFileHandle(toLabelFn(nm),{create:true});
          var w=await fh.createWritable();
          await w.write(JSON.stringify(d,null,1));
          await w.close();
          moved++;
        }catch(err){}
      }
      localStorage.removeItem(k2);
    }
    if(moved) toast("已把 "+moved+" 条本机历史迁移到落库目录",true);
  }catch(err){}
}
// 把目录里已有的 *.labels.json 收进 ALL_DATA 并生成 labels-data.js 快照
// （首次连接目录时调用：此后 file:// 双击打开无需授权即可看到全部历史）
async function rebuildSnapshotFromDir(){
  if(!dirHandle) return;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return;
    var names=[], changed=false;
    for await (var entry of dirHandle.values()){
      if(entry.kind==="file" && /\.labels\.json$/i.test(entry.name)) names.push(entry.name);
    }
    for(var i=0;i<names.length;i++){
      try{
        var d=JSON.parse(await (await (await dirHandle.getFileHandle(names[i])).getFile()).text());
        if(!d.pieces) continue;
        var nm=d.photo||names[i].replace(/\.labels\.json$/i,"");
        if(!ALL_DATA[nm] || (d.updated||0)>(ALL_DATA[nm].updated||0)){ ALL_DATA[nm]=d; changed=true; }
      }catch(err){}
    }
    await writeSnapshot();
    if(changed) toast("已生成默认数据快照（labels-data.js）· 下次打开自动加载",true);
  }catch(err){}
}
async function persistPhoto(name){
  if(!dirHandle||!name||!P.pieces.length) return;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted"){ setDirDot("warn"); return; }
    var d=dataNow();
    // 1) 单照片 json（外部管线/导出用）
    var fh=await dirHandle.getFileHandle(toLabelFn(name),{create:true});
    var w=await fh.createWritable();
    await w.write(JSON.stringify(d,null,1));
    await w.close();
    // 2) 全量快照 labels-data.js（file:// 双击打开时无需授权即可读回全部历史）
    ALL_DATA[name]=d;
    await writeSnapshot();
    setDirDot("on");
  }catch(err){
    setDirDot("warn");
  }
}
// 照片副本也存进落库目录（与 .labels.json 并排同名）：文件夹自包含，
// 换浏览器 / 清缓存后点历史仍能直接加载。已存在同名则跳过。
async function persistPhotoImage(name, blob){
  if(!dirHandle||!blob) return;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return;
    var fn=String(name).replace(/[\\/:*?"<>|]/g,"_");
    try{ await dirHandle.getFileHandle(fn); return; }catch(e){}
    var fh=await dirHandle.getFileHandle(fn,{create:true});
    var w=await fh.createWritable();
    await w.write(blob);
    await w.close();
  }catch(err){}
}
// 从落库目录找照片原图（历史点击时 IndexedDB 无缓存的后备）
async function photoFromDir(name){
  if(!dirHandle) return null;
  try{
    var p=await dirHandle.queryPermission({mode:"readwrite"});
    if(p!=="granted") return null;
    var fh=await dirHandle.getFileHandle(String(name).replace(/[\\/:*?"<>|]/g,"_"));
    return await fh.getFile();
  }catch(err){ return null; }
}

/* ================= 启动 ================= */
restoreDir();
probeOcrSvc();
document.addEventListener("keydown",function(e){
  var ae=document.activeElement;
  var inEd=(ae===$("edLabel")||ae===$("edDeg"));
  if(e.key==="Escape"){ selectPiece(-1); $("hist").classList.remove("on"); }
  // Del 键任何情况都删选中框（输入框聚焦时也生效，forward-delete 编辑场景少）；
  // Backspace 只在非输入焦点时删框，输入框内保持删字符
  if(e.key==="Delete"){
    if(P.sel>=0){ e.preventDefault(); delSelected(); }
  } else if(e.key==="Backspace"){
    if(!inEd && P.sel>=0){ e.preventDefault(); delSelected(); }
  }
});
function delSelected(){
  var n=P.sel+1;
  P.pieces.splice(P.sel,1);
  selectPiece(-1);
  saveSoon();
  toast("已删除块 #"+n);
}
</script>
